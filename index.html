// tiles run tilings, then generative, then radial, then fractal
const PAT_ORDER = [
  'honeycomb', 'cubes', 'triangles', 'kagome', 'truncated',
  'weave', 'chain', 'hexagram', 'chevron', 'scales',
  'truchet', 'maze', 'fracture', 'pinwheel', 'circuit', 'contour', 'halftone',
  'flower', 'metatron', 'star', 'nested', 'spiral', 'ripple', 'branch',
  'sierpinski', 'snowflake', 'hexaflake', 'gosper'
];

const PAT_ICON = {
  honeycomb:{ R:7.5, rings:2 }, cubes:{ R:9, rings:1 },   triangles:{ R:11, rings:1 },
  kagome:{ R:9, rings:1 },      truncated:{ R:9, rings:1 },weave:{ R:8, rings:1 },
  chain:{ R:6, rings:1 },       hexagram:{ R:7, rings:1 }, chevron:{ R:7, rings:1 },
  scales:{ R:6, rings:1 },      truchet:{ R:9, rings:1 },  maze:{ R:6, rings:1 },
  fracture:{ R:7, rings:1 },    pinwheel:{ R:9, rings:1 }, circuit:{ R:7, rings:1 },
  contour:{ R:7, rings:1 },     halftone:{ R:5, rings:2 }, flower:{ R:6.5, rings:1 },
  metatron:{ R:3.4, rings:1 },  star:{ R:5.5, rings:3 },   nested:{ R:5, rings:3 },
  spiral:{ R:2.6, rings:3 },    ripple:{ R:5, rings:1 },   branch:{ R:6, rings:2 },
  sierpinski:{ R:5, rings:3 },  snowflake:{ R:5.5, rings:2 },
  hexaflake:{ R:4.2, rings:3 }, gosper:{ R:2.6, rings:2 }
};

function patternIcon(kind) {
  const c = document.createElement('canvas');
  const d = 40, dpr = Math.min(window.devicePixelRatio || 1, 3);
  c.width = d * dpr; c.height = d * dpr;
  const cc = c.getContext('2d');
  cc.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cfg = PAT_ICON[kind];
  const { segs, polys } = PATTERNS[kind].gen({
    cx:d/2, cy:d/2, R:cfg.R, rings:cfg.rings, rot:0, seed:S.pat.seed, dens:0.35
  });
  const ring = [];
  for (let k = 0; k < 40; k++) { const a = k / 40 * TAU; ring.push([d/2 + Math.cos(a)*18, d/2 + Math.sin(a)*18]); }
  const E = clipEdges(ring);
  const col = themeColors();
  cc.lineCap = 'round';
  cc.fillStyle = col.ink;
  for (const q of polys) {
    const cp = clipPoly(q, E);
    if (cp.length < 3) continue;
    cc.beginPath();
    cp.forEach((p, i) => i ? cc.lineTo(p[0], p[1]) : cc.moveTo(p[0], p[1]));
    cc.closePath(); cc.fill();
  }
  cc.strokeStyle = col.ink; cc.lineWidth = 0.85;
  cc.beginPath();
  for (const [a, b] of segs) {
    const s = clipSeg(a, b, E);
    if (!s) continue;
    cc.moveTo(s[0][0], s[0][1]); cc.lineTo(s[1][0], s[1][1]);
  }
  cc.stroke();
  return c;
}

let patRows = [];
function buildPatternPane() {
  const p = document.getElementById('pane-pattern');
  p.innerHTML = ''; patRows = [];

  const g0 = group('Flat pattern');
  const tiles = node('div', 'tiles');

    b.appendChild(patternIcon(k));
    b.appendChild(node('span', null, PATTERNS[k].label));
    b.addEventListener('click', () => {
      S.pat.kind = k;

      patCache.key = null;
      buildPatternPane(); draw(); save(); haptic();
    });

  }
  g0.appendChild(tiles);
  p.appendChild(g0);

  if (!S.pat.kind) {
    const e = node('div', 'empty');
    e.innerHTML = 'No pattern<br>Pick one to lay it under your forms';
    p.appendChild(e);

  }

  const spec = PATTERNS[S.pat.kind];

  const g1 = group(spec.label);
  const add = (row) => { g1.appendChild(row); patRows.push(row); };
  if (spec.params.includes('scale'))
    add(slider('Cell size', { min:12, max:90, step:1,

  if (spec.params.includes('rings'))
    add(slider('Extent', { min:1, max:9, step:1,
      get:() => S.pat.rings, set:v => { S.pat.rings = v | 0; bump(); }, fmt:v => String(v | 0) }));
  if (spec.params.includes('rot'))
    add(slider('Rotation', { min:-180, max:180, step:1,
      get:() => Math.round(S.pat.rot * 180 / Math.PI),
      set:v => { S.pat.rot = v * Math.PI / 180; bump(); }, fmt:v => Math.round(v) + '°' }));
  if (spec.params.includes('dens'))
    add(slider(spec.densLabel || 'Variation', { min:0, max:1, step:0.01,
      get:() => S.pat.dens, set:v => { S.pat.dens = v; bump(); }, fmt:v => Math.round(v * 100) + '%' }));
  if (spec.params.includes('seed')) {
    const acts = node('div', 'acts two');
    acts.appendChild(actionBtn('Reroll', () => {
      S.pat.seed = (S.pat.seed * 1664525 + 1013904223) >>> 0 || 1;
      bump(); buildPatternPane(); draw(); save(); haptic();
    }));
    acts.appendChild(actionBtn('Clear', () => {
      S.pat.kind = null; bump(); buildPatternPane(); draw(); save();
    }, 'warn'));
    g1.appendChild(acts);
  } else {
    const acts = node('div', 'acts two');
    acts.appendChild(actionBtn('Clear', () => {
      S.pat.kind = null; bump(); buildPatternPane(); draw(); save();
    }, 'warn'));
    g1.appendChild(acts);
  }
  p.appendChild(g1);

  const g2 = group('Frame');
  const fr = segmented('Crop to', [
    { label:'Hexagon', value:'hex' }, { label:'Circle', value:'circle' }, { label:'Full bleed', value:'none' }
  ], () => S.pat.frame, v => { S.pat.frame = v; bump(); });
  g2.appendChild(fr); patRows.push(fr);
  const fs = slider('Frame size', { min:0.35, max:1, step:0.01,
    get:() => S.pat.frameR, set:v => { S.pat.frameR = v; bump(); }, fmt:v => Math.round(v * 100) + '%' });
  g2.appendChild(fs); patRows.push(fs);
  p.appendChild(g2);

  const g3 = group('Layer');
  const ly = segmented('Show', [
    { label:'Behind forms', value:'behind' }, { label:'Pattern only', value:'only' }, { label:'Off', value:'off' }
  ], () => S.pat.layer, v => { S.pat.layer = v; bump(); });
  g3.appendChild(ly); patRows.push(ly);
  g3.appendChild(node('p', 'note', 'The pattern is a flat panel — it stays put while you orbit the forms above it, and it exports with them.'));
  p.appendChild(g3);
}

/* ---------------------------------------------------------- export */
function exportColors() {
  if (!S.ex.stencil) {
    const c = themeColors();
    return { paper:c.paper, ink:c.ink, ghost:c.ghost, hair:c.hair, accent:c.ink };
  }
  return { paper:'#FFFFFF', ink:'#000000', ghost:'#9A9A9A', hair:'#D6D6D6', accent:'#000000' };
}

function download(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function exportPNG(scale) {
  const k = scale || 3;
  const w = Math.round(CW * k), h = Math.round(CH * k);
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const cc = c.getContext('2d');
  const { ops } = buildOps({ w, h, lw:k, exportMode:true });
  paint(cc, ops, exportColors(), w, h);
  c.toBlob(b => { if (b) { download(b, 'tatgeo-sheet.png'); toast('PNG saved'); } }, 'image/png');
}

function exportSVG() {
  const { ops } = buildOps({ w:CW, h:CH, lw:1, exportMode:true });
  const svg = toSVG(ops, CW, CH, exportColors());
  download(new Blob([svg], { type:'image/svg+xml' }), 'tatgeo-sheet.svg');
  toast('SVG saved');
}

/* ---------------------------------------------------------- chrome sync */
function syncReadout() {
  const sh = current();
  el.readout.classList.toggle('on', !!sh);
  const txt = el.readout.querySelector('span');
  txt.textContent = sh ? `${sh.name} · ${S.shapes.indexOf(sh) + 1}/${S.shapes.length}`
                       : (S.shapes.length ? `${S.shapes.length} forms` : 'Empty sheet');
}
function syncEdit() { buildEditPane(); }
function syncAll() {
  buildEditPane(); syncReadout();
  styleRows.forEach(r => r.refresh && r.refresh());
  sceneRows.forEach(r => r.refresh && r.refresh());
  patRows.forEach(r => r.refresh && r.refresh());
}

let toastT;
function toast(msg) {
  el.hint.textContent = msg;
  el.hint.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => el.hint.classList.remove('show'), 2200);
}

/* ---------------------------------------------------------- tabs + sheet */
el.tabs.addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]');
  if (!b) return;
  for (const t of el.tabs.querySelectorAll('button')) t.setAttribute('aria-selected', String(t === b));
  for (const p of document.querySelectorAll('.pane')) p.classList.remove('on');
  document.getElementById('pane-' + b.dataset.tab).classList.add('on');
  if (el.sheet.dataset.state === 'peek') el.sheet.dataset.state = 'open';
  requestAnimationFrame(resize);
});

el.grip.addEventListener('click', () => {
  el.sheet.dataset.state = el.sheet.dataset.state === 'open' ? 'peek' : 'open';
  requestAnimationFrame(resize);
});

el.undo.addEventListener('click', undo);
el.quickpng.addEventListener('click', () => exportPNG());

/* ---------------------------------------------------------- boot */
buildShapesPane();
buildStylePane();
buildScenePane();
buildPatternPane();

if (!load()) {
  S.shapes = PRESETS.monolith();
  S.sel = null;
}
syncAll();

new ResizeObserver(() => resize()).observe(el.stage);
window.addEventListener('orientationchange', () => setTimeout(resize, 220));

const mq = window.matchMedia('(prefers-color-scheme: dark)');
const onTheme = () => { buildShapesPane(); buildPatternPane(); draw(); };
if (mq.addEventListener) mq.addEventListener('change', onTheme);
else if (mq.addListener) mq.addListener(onTheme);
new MutationObserver(onTheme).observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });

resize();
setTimeout(() => toast('Drag to orbit · tap a form to select'), 500);
</script>
