<title>Tatgeo — Geometric Tattoo Studio</title>

<style>
/* ============================== TOKENS ============================== */
:root{
  --paper:#F4F3F6;      /* the drawing sheet */
  --chrome:#E2DFE7;     /* surrounding studio surface */
  --panel:#EDEBF1;
  --sunk:#D8D4DF;
  --ink:#16151C;
  --ink-2:#4C4859;
  --ink-3:#84808F;
  --line:#C6C1D0;
  --hair:#B7B2C2;
  --accent:#5B44C9;
  --accent-ink:#FFFFFF;
  --accent-soft:#E4DEFB;
  --danger:#B03325;
  --shadow:rgba(22,21,28,.14);

  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;

  --r:2px;
  --tap:44px;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#0F0E13; --chrome:#17161D; --panel:#1C1A23; --sunk:#131219;
    --ink:#EDEBF3; --ink-2:#A9A4B6; --ink-3:#6C6779;
    --line:#2E2B37; --hair:#3A3644;
    --accent:#9C86FF; --accent-ink:#14121C; --accent-soft:#241E3D;
    --danger:#FF8A7A;
    --shadow:rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --paper:#0F0E13; --chrome:#17161D; --panel:#1C1A23; --sunk:#131219;
  --ink:#EDEBF3; --ink-2:#A9A4B6; --ink-3:#6C6779;
  --line:#2E2B37; --hair:#3A3644;
  --accent:#9C86FF; --accent-ink:#14121C; --accent-soft:#241E3D;
  --danger:#FF8A7A;
  --shadow:rgba(0,0,0,.5);
}
:root[data-theme="light"]{
  --paper:#F4F3F6; --chrome:#E2DFE7; --panel:#EDEBF1; --sunk:#D8D4DF;
  --ink:#16151C; --ink-2:#4C4859; --ink-3:#84808F;
  --line:#C6C1D0; --hair:#B7B2C2;
  --accent:#5B44C9; --accent-ink:#FFFFFF; --accent-soft:#E4DEFB;
  --danger:#B03325;
  --shadow:rgba(22,21,28,.14);
}

/* ============================== BASE ============================== */
*{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0;
  background:var(--chrome);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
button{ font:inherit; color:inherit; background:none; border:none; padding:0; cursor:pointer; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

.mono{ font-family:var(--mono); }
.eyebrow{
  font-family:var(--mono); font-size:10px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--ink-3);
}

/* ============================== SHELL ============================== */
#app{
  height:100dvh;
  display:grid;
  grid-template-rows:auto 1fr auto;
  grid-template-columns:100%;
}

/* ------------------------------ topbar ------------------------------ */
.topbar{
  display:flex; align-items:center; gap:8px;
  padding:0 10px; height:52px;
  border-bottom:1px solid var(--line);
  background:var(--chrome);
}
.wordmark{ display:flex; flex-direction:column; gap:1px; flex:none; }
.wordmark b{
  font-family:var(--mono); font-weight:700; font-size:15px;
  letter-spacing:.24em; text-transform:uppercase; line-height:1;
  white-space:nowrap;
}
.wordmark span{ font-size:9px; letter-spacing:.14em; white-space:nowrap; }
.readout{
  flex:0 1 auto; min-width:0; margin-left:auto;
  display:flex; align-items:center; justify-content:center; gap:7px;
  font-family:var(--mono); font-size:10.5px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-2);
  border:1px solid var(--line); border-radius:var(--r);
  padding:5px 8px;
}
.readout span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.readout i{ width:6px; height:6px; background:var(--hair); display:block; flex:none; }
@media (max-width:359px){ .wordmark span{ display:none; } }
.readout.on i{ background:var(--accent); }
.iconbtn{
  width:36px; height:36px; flex:none;
  display:grid; place-items:center;
  border:1px solid var(--line); border-radius:var(--r);
  background:var(--panel);
}
.iconbtn:disabled{ opacity:.38; cursor:default; }
.iconbtn:active:not(:disabled){ background:var(--sunk); }
.iconbtn svg{ width:17px; height:17px; }

/* ------------------------------ stage ------------------------------ */
.stage{
  position:relative; overflow:hidden;
  background:var(--paper);
  min-height:0;
}
#view{ display:block; width:100%; height:100%; touch-action:none; }

.reg{ position:absolute; pointer-events:none; color:var(--hair); }
.reg svg{ display:block; width:14px; height:14px; }
.reg.tl{ top:9px; left:9px; } .reg.tr{ top:9px; right:9px; }
.reg.bl{ bottom:9px; left:9px; } .reg.br{ bottom:9px; right:9px; }
.stamp{
  position:absolute; bottom:8px; left:50%; transform:translateX(-50%);
  font-family:var(--mono); font-size:9px; letter-spacing:.18em;
  color:var(--hair); pointer-events:none; text-transform:uppercase;
  white-space:nowrap;
}

.hint{
  position:absolute; left:50%; top:14px; transform:translateX(-50%);
  font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase;
  background:var(--ink); color:var(--paper);
  padding:7px 11px; border-radius:var(--r);
  pointer-events:none; opacity:0; transition:opacity .35s ease;
  white-space:nowrap; max-width:92vw; overflow:hidden; text-overflow:ellipsis;
}
.hint.show{ opacity:1; }

/* ------------------------------ sheet ------------------------------ */
.sheet{
  background:var(--chrome);
  border-top:1px solid var(--line);
  box-shadow:0 -8px 28px -18px var(--shadow);
  display:flex; flex-direction:column;
  min-height:0; max-height:58dvh;
}
.grip{
  height:22px; flex:none; display:grid; place-items:center; width:100%;
  touch-action:none;
}
.grip::after{
  content:""; width:34px; height:3px; border-radius:2px; background:var(--hair);
}
.tabs{
  display:grid; grid-template-columns:repeat(5,1fr);
  border-top:1px solid var(--line); border-bottom:1px solid var(--line);
  background:var(--panel);
}
.tabs button{
  height:40px;
  font-family:var(--mono); font-size:9px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--ink-3); border-right:1px solid var(--line);
  position:relative;
}
.tabs button:last-child{ border-right:none; }
.tabs button[aria-selected="true"]{ color:var(--ink); background:var(--chrome); }
.tabs button[aria-selected="true"]::after{
  content:""; position:absolute; left:0; right:0; top:-1px; height:2px; background:var(--accent);
}
.panes{
  overflow-y:auto; overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  padding:14px 14px calc(16px + env(safe-area-inset-bottom));
  min-height:0;
}
.sheet[data-state="peek"] .panes{ display:none; }
.pane{ display:none; flex-direction:column; gap:16px; }
.pane.on{ display:flex; }

/* ------------------------------ controls ------------------------------ */
.group{ display:flex; flex-direction:column; gap:9px; }
.group > .eyebrow{ padding-bottom:1px; border-bottom:1px solid var(--line); }

.tiles{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
@media (min-width:400px){ .tiles{ grid-template-columns:repeat(4,1fr); } }
.tile{
  border:1px solid var(--line); border-radius:var(--r);
  background:var(--panel);
  padding:9px 4px 7px;
  display:flex; flex-direction:column; align-items:center; gap:6px;
}
.tile:active{ background:var(--accent-soft); border-color:var(--accent); }
.tile.on{ background:var(--accent-soft); border-color:var(--accent); }
.tile.on span{ color:var(--ink); }
.tile canvas{ width:40px; height:40px; display:block; }
.tile span{
  font-family:var(--mono); font-size:9px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-2);
}

.row{ display:flex; flex-direction:column; gap:5px; }
.row .lab{
  display:flex; align-items:baseline; justify-content:space-between; gap:10px;
  font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink-2);
}
.row .val{ color:var(--ink); font-variant-numeric:tabular-nums; letter-spacing:.06em; }

input[type=range]{
  -webkit-appearance:none; appearance:none;
  width:100%; height:22px; background:transparent; margin:0;
}
input[type=range]::-webkit-slider-runnable-track{
  height:2px; background:var(--hair);
}
input[type=range]::-moz-range-track{ height:2px; background:var(--hair); }
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; appearance:none;
  width:18px; height:18px; margin-top:-8px;
  background:var(--paper); border:2px solid var(--ink); border-radius:var(--r);
}
input[type=range]::-moz-range-thumb{
  width:15px; height:15px;
  background:var(--paper); border:2px solid var(--ink); border-radius:var(--r);
}
input[type=range]:active::-webkit-slider-thumb{ background:var(--accent); border-color:var(--accent); }
input[type=range]:active::-moz-range-thumb{ background:var(--accent); border-color:var(--accent); }

.seg{ display:flex; border:1px solid var(--line); border-radius:var(--r); overflow:hidden; }
.seg button{
  flex:1; min-height:36px; padding:0 4px;
  font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-2); background:var(--panel);
  border-right:1px solid var(--line);
}
.seg button:last-child{ border-right:none; }
.seg button[aria-pressed="true"]{ background:var(--ink); color:var(--paper); }

.acts{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.acts.two{ grid-template-columns:repeat(2,1fr); }
.btn{
  min-height:var(--tap);
  display:grid; place-items:center; gap:2px;
  border:1px solid var(--line); border-radius:var(--r);
  background:var(--panel);
  font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--ink);
}
.btn:active{ background:var(--sunk); }
.btn.solid{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
.btn.solid:active{ opacity:.82; }
.btn.warn{ color:var(--danger); }

.empty{
  border:1px dashed var(--line); border-radius:var(--r);
  padding:22px 16px; text-align:center; color:var(--ink-3);
  font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  line-height:1.8;
}
.note{ font-size:12px; color:var(--ink-3); line-height:1.5; }

.chips{ display:flex; flex-wrap:wrap; gap:6px; }
.chip{
  border:1px solid var(--line); border-radius:var(--r);
  padding:8px 11px; min-height:36px;
  font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase;
  background:var(--panel); color:var(--ink-2);
}
.chip[aria-pressed="true"]{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }

/* ------------------------------ wide screens ------------------------------ */
@media (min-width:900px){
  #app{
    grid-template-columns:1fr 348px;
    grid-template-rows:auto 1fr;
  }
  .topbar{ grid-column:1 / -1; }
  .stage{ grid-column:1; grid-row:2; }
  .sheet{
    grid-column:2; grid-row:2;
    border-top:none; border-left:1px solid var(--line);
    box-shadow:none; max-height:none;
  }
  .grip{ display:none; }
  .tabs{ border-top:none; }
  .sheet[data-state="peek"] .panes{ display:block; }
  .panes{ padding-bottom:20px; }
}

@media (prefers-reduced-motion:reduce){
  *{ transition-duration:.01ms !important; animation-duration:.01ms !important; }
}
</style>

    </div>
  </section>
</div>

<script>
"use strict";
/* =====================================================================
   Tatgeo — a hand-rolled hidden-line 3D engine for tattoo linework.
   Faces are painted back-to-front in the paper colour, then stroked,
   which removes hidden lines for convex solids without a depth buffer.
   ===================================================================== */

/* ---------------------------------------------------------- vec / rot */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rotX = (p, a) => { const c = Math.cos(a), s = Math.sin(a); return [p[0], p[1]*c - p[2]*s, p[1]*s + p[2]*c]; };
const rotY = (p, a) => { const c = Math.cos(a), s = Math.sin(a); return [p[0]*c + p[2]*s, p[1], -p[0]*s + p[2]*c]; };
const rotZ = (p, a) => { const c = Math.cos(a), s = Math.sin(a); return [p[0]*c - p[1]*s, p[0]*s + p[1]*c, p[2]]; };

function newell(pts) {
  let nx = 0, ny = 0, nz = 0;
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = pts[(i + 1) % pts.length];
    nx += (a[1] - b[1]) * (a[2] + b[2]);
    ny += (a[2] - b[2]) * (a[0] + b[0]);
    nz += (a[0] - b[0]) * (a[1] + b[1]);
  }
  const L = Math.hypot(nx, ny, nz) || 1;
  return [nx / L, ny / L, nz / L];
}

/* ---------------------------------------------------------- geometry */
// Every generator returns { v: vertices, f: faces }. Faces are re-oriented
// outward from the local origin at build time, so hand-typed winding in the
// platonic tables can't produce inverted normals.
function orient(g) {
  for (const face of g.f) {
    const pts = face.map(i => g.v[i]);
    const n = newell(pts);
    let cx = 0, cy = 0, cz = 0;
    for (const p of pts) { cx += p[0]; cy += p[1]; cz += p[2]; }
    const k = 1 / pts.length;
    if (n[0]*cx*k + n[1]*cy*k + n[2]*cz*k < 0) face.reverse();
  }
  // unique edges, each carrying the faces it borders — ghost mode needs the
  // adjacency to tell a hidden edge from a visible one
  const seen = new Map(); g.e = []; g.ef = [];
  for (let fi = 0; fi < g.f.length; fi++) {
    const face = g.f[fi];
    for (let i = 0; i < face.length; i++) {
      const a = face[i], b = face[(i + 1) % face.length];
      const key = a < b ? a + ':' + b : b + ':' + a;
      let ei = seen.get(key);
      if (ei === undefined) { ei = g.e.length; seen.set(key, ei); g.e.push([a, b]); g.ef.push([]); }
      g.ef[ei].push(fi);
    }
  }
  return g;
}

function ring(n, r, y, phase) {
  const out = [];
  for (let i = 0; i < n; i++) {
    const a = phase + i / n * TAU;
    out.push([Math.cos(a) * r, y, Math.sin(a) * r]);
  }
  return out;
}

function boxGeo(w, h, d) {
  const v = [];
  for (const sy of [-1, 1]) for (const sz of [-1, 1]) for (const sx of [-1, 1]) v.push([sx*w, sy*h, sz*d]);
  // index order: y,z,x  ->  0..7
  const f = [
    [0,1,3,2], [4,6,7,5],          // bottom, top
    [0,2,6,4], [1,5,7,3],          // z-, z+
    [0,4,5,1], [2,3,7,6]           // x-, x+
  ];
  return orient({ v, f });
}

function prismGeo(n, r, h) {
  const phase = -Math.PI / 2 + Math.PI / n;
  const bot = ring(n, r, -h, phase), top = ring(n, r, h, phase);
  const v = bot.concat(top), f = [];
  for (let i = 0; i < n; i++) {
    const j = (i + 1) % n;
    f.push([i, j, n + j, n + i]);
  }
  f.push(bot.map((_, i) => i).reverse());
  f.push(top.map((_, i) => n + i));
  return orient({ v, f });
}

function pyramidGeo(n, r, h) {
  const phase = -Math.PI / 2 + Math.PI / n;
  const base = ring(n, r, -h, phase);
  const v = base.concat([[0, h, 0]]), f = [];
  for (let i = 0; i < n; i++) f.push([i, (i + 1) % n, n]);
  f.push(base.map((_, i) => i).reverse());
  return orient({ v, f });
}

function crystalGeo(n, r, h) {
  const phase = -Math.PI / 2 + Math.PI / n;
  const cap = r * 1.15;
  const bot = ring(n, r, -h, phase), top = ring(n, r, h, phase);
  const v = bot.concat(top, [[0, h + cap, 0], [0, -h - cap, 0]]);
  const f = [];
  for (let i = 0; i < n; i++) {
    const j = (i + 1) % n;
    f.push([i, j, n + j, n + i]);
    f.push([n + i, n + j, 2 * n]);
    f.push([j, i, 2 * n + 1]);
  }
  return orient({ v, f });
}

function tetraGeo(s) {
  const k = s * 0.72;
  const v = [[k,k,k], [k,-k,-k], [-k,k,-k], [-k,-k,k]];
  return orient({ v, f: [[0,1,2],[0,2,3],[0,3,1],[1,3,2]] });
}

function octaGeo(s) {
  const v = [[s,0,0],[-s,0,0],[0,s,0],[0,-s,0],[0,0,s],[0,0,-s]];
  const f = [[0,2,4],[2,1,4],[1,3,4],[3,0,4],[2,0,5],[1,2,5],[3,1,5],[0,3,5]];
  return orient({ v, f });
}

const ICO_V = (() => {
  const t = (1 + Math.sqrt(5)) / 2;
  return [[-1,t,0],[1,t,0],[-1,-t,0],[1,-t,0],[0,-1,t],[0,1,t],
          [0,-1,-t],[0,1,-t],[t,0,-1],[t,0,1],[-t,0,-1],[-t,0,1]]
         .map(p => { const L = Math.hypot(p[0],p[1],p[2]); return [p[0]/L, p[1]/L, p[2]/L]; });
})();
const ICO_F = [[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],[1,5,9],[5,11,4],[11,10,2],
               [10,7,6],[7,1,8],[3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],[4,9,5],
               [2,4,11],[6,2,10],[8,6,7],[9,8,1]];

function icosaGeo(s) {
  return orient({ v: ICO_V.map(p => [p[0]*s, p[1]*s, p[2]*s]), f: ICO_F.map(f => f.slice()) });
}

// The dodecahedron is built as the dual of the icosahedron: each icosahedron
// vertex becomes a pentagon made from the centroids of its five faces.
function dodecaGeo(s) {
  const centers = ICO_F.map(f => {
    let x = 0, y = 0, z = 0;
    for (const i of f) { x += ICO_V[i][0]; y += ICO_V[i][1]; z += ICO_V[i][2]; }
    const L = Math.hypot(x, y, z);
    return [x/L*s, y/L*s, z/L*s];
  });
  const faces = [];
  for (let vi = 0; vi < ICO_V.length; vi++) {
    const around = [];
    for (let fi = 0; fi < ICO_F.length; fi++) if (ICO_F[fi].includes(vi)) around.push(fi);
    const n = ICO_V[vi];
    // build a basis in the plane perpendicular to the vertex normal, then sort by angle
    let ref = Math.abs(n[1]) < 0.9 ? [0,1,0] : [1,0,0];
    const u = [n[1]*ref[2] - n[2]*ref[1], n[2]*ref[0] - n[0]*ref[2], n[0]*ref[1] - n[1]*ref[0]];
    const uL = Math.hypot(u[0],u[1],u[2]); u[0]/=uL; u[1]/=uL; u[2]/=uL;
    const w = [n[1]*u[2] - n[2]*u[1], n[2]*u[0] - n[0]*u[2], n[0]*u[1] - n[1]*u[0]];
    around.sort((a, b) => {
      const pa = centers[a], pb = centers[b];
      const aa = Math.atan2(pa[0]*w[0]+pa[1]*w[1]+pa[2]*w[2], pa[0]*u[0]+pa[1]*u[1]+pa[2]*u[2]);
      const ab = Math.atan2(pb[0]*w[0]+pb[1]*w[1]+pb[2]*w[2], pb[0]*u[0]+pb[1]*u[1]+pb[2]*u[2]);
      return aa - ab;
    });
    faces.push(around);
  }
  return orient({ v: centers, f: faces });
}

const KINDS = {
  box:     { label:'Cube',    build:s => boxGeo(s.size, s.height, s.depth),        params:['size','height','depth'] },
  prism:   { label:'Prism',   build:s => prismGeo(s.sides, s.size, s.height),      params:['sides','size','height'] },
  crystal: { label:'Crystal', build:s => crystalGeo(s.sides, s.size, s.height),    params:['sides','size','height'] },
  pyramid: { label:'Pyramid', build:s => pyramidGeo(s.sides, s.size, s.height),    params:['sides','size','height'] },
  tetra:   { label:'Tetra',   build:s => tetraGeo(s.size),                          params:['size'] },
  octa:    { label:'Octa',    build:s => octaGeo(s.size),                           params:['size'] },
  icosa:   { label:'Icosa',   build:s => icosaGeo(s.size),                          params:['size'] },
  dodeca:  { label:'Dodeca',  build:s => dodecaGeo(s.size),                         params:['size'] }
};

const geoCache = new Map();
function geoFor(s) {
  const k = KINDS[s.kind];
  const key = [s.kind, s.size, s.height, s.depth, s.sides].join('|');
  let g = geoCache.get(key);
  if (!g) { g = k.build(s); geoCache.set(key, g); if (geoCache.size > 300) geoCache.clear(); }
  return g;
}

/* ---------------------------------------------------------- state */
let uid = 1;
function makeShape(kind, over) {
  return Object.assign({
    id: uid++, kind,
    pos: [0, 0, 0], rot: [0, 0, 0],
    size: 1, height: 1, depth: 1, sides: 6,
    name: KINDS[kind].label
  }, over || {});
}

const S = {
  shapes: [],
  sel: null,
  cam: { yaw: -0.62, pitch: 0.48, dist: 9.5 },
  style: { mode: 'solid', fill: 'open', weight: 1.7, tone: 0.5, light: 0.85, proj: 'ortho', grid: true },
  sym: { mirror: false, radial: 1 },
  pat: { kind: null, scale: 34, rings: 4, rot: 0, seed: 1, dens: 0.35, frame: 'hex', frameR: 0.86, layer: 'behind' },
  ex: { stencil: true }
};

const PRESETS = {
  // a contiguous stack — each tier sits exactly on the one below and turns 24°
  monolith: () => [
    makeShape('box', { pos:[0,-1.55,0], size:1.30, height:0.35, depth:1.30 }),
    makeShape('box', { pos:[0,-0.55,0], size:1.00, height:0.65, depth:1.00, rot:[0,0.42,0] }),
    makeShape('box', { pos:[0, 0.55,0], size:0.70, height:0.45, depth:0.70, rot:[0,0.84,0] })
  ],
  quartz: () => [
    makeShape('crystal', { pos:[0,0.2,0], sides:6, size:0.72, height:1.5 }),
    makeShape('crystal', { pos:[-1.25,-0.5,0.35], sides:6, size:0.44, height:0.95, rot:[0.16,0.6,0.3] }),
    makeShape('crystal', { pos:[1.15,-0.7,-0.3], sides:6, size:0.38, height:0.75, rot:[-0.2,0.2,-0.34] })
  ],
  // one cell per orbit of the hex lattice; the ×6 repeat closes both rings.
  // 1.386 = flat-to-flat width at radius 0.8, so neighbours meet edge to edge.
  hive: () => [
    makeShape('prism', { pos:[1.386,0,0],     sides:6, size:0.8, height:0.16 }),
    makeShape('prism', { pos:[2.078,0,1.200], sides:6, size:0.8, height:0.16 }),
    makeShape('prism', { pos:[2.772,0,0],     sides:6, size:0.8, height:0.16 })
  ],
  solids: () => [

    makeShape('dodeca', { pos:[0,0,0], size:0.95 }),
    makeShape('octa',   { pos:[2.1,0,0], size:1.05 })
  ]
};

const HIVE_RADIAL = 6;

/* ---------------------------------------------------------- history */
const past = [];
function snapshot() {
  return JSON.stringify({ shapes: S.shapes, sel: S.sel, sym: S.sym });
}
function commit() {
  past.push(snapshot());
  if (past.length > 40) past.shift();
  el.undo.disabled = false;
  save();
}
function undo() {
  const prev = past.pop();
  if (!prev) return;
  const d = JSON.parse(prev);
  S.shapes = d.shapes; S.sel = d.sel; S.sym = d.sym;
  el.undo.disabled = past.length === 0;
  save(); syncAll(); draw();
}

const LS = 'tatgeo.sheet.v1';
function save() {
  try {
    localStorage.setItem(LS, JSON.stringify({
      shapes: S.shapes, cam: S.cam, style: S.style, sym: S.sym, pat: S.pat, sel: S.sel
    }));
  } catch (e) { /* private mode — the sheet just won't persist */ }
}
function load() {
  try {
    const raw = localStorage.getItem(LS);
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (!d.shapes || !d.shapes.length) return false;
    S.shapes = d.shapes;
    Object.assign(S.cam, d.cam || {});
    Object.assign(S.style, d.style || {});
    Object.assign(S.sym, d.sym || {});
    Object.assign(S.pat, d.pat || {});
    if (S.pat.kind && !PATTERNS[S.pat.kind]) S.pat.kind = null;
    S.sel = d.sel ?? null;
    uid = Math.max(...S.shapes.map(s => s.id)) + 1;
    return true;
  } catch (e) { return false; }
}

/* ---------------------------------------------------------- camera */
// View is rotY(-yaw) then rotX(+pitch), so the camera sits at world y =
// +dist·sin(pitch): a positive pitch looks down on the sheet. Inverting this
// pair flips which faces cull, and stacked solids then sort back-to-front.
function camBasis() {
  const { yaw, pitch } = S.cam;
  const b = v => rotY(rotX(v, -pitch), yaw);
  return { right: b([1,0,0]), up: b([0,1,0]) };
}
function toView(p) { return rotX(rotY([p[0], p[1], p[2]], -S.cam.yaw), S.cam.pitch); }

/* ---------------------------------------------------------- instances */
function instances() {
  const list = [];
  const n = Math.max(1, S.sym.radial | 0);
  for (let k = 0; k < n; k++) {
    const a = k / n * TAU;
    list.push({ spin: a, mirror: false });
    if (S.sym.mirror) list.push({ spin: a, mirror: true });
  }
  return list;
}

/* ---------------------------------------------------------- hatching */
function convexHatch(pts, angle, spacing, out, width) {
  const c = Math.cos(-angle), s = Math.sin(-angle);
  const rp = pts.map(p => [p[0]*c - p[1]*s, p[0]*s + p[1]*c]);
  let minY = Infinity, maxY = -Infinity;
  for (const p of rp) { if (p[1] < minY) minY = p[1]; if (p[1] > maxY) maxY = p[1]; }
  const count = (maxY - minY) / spacing;
  if (!isFinite(count) || count > 240) return;
  const ic = Math.cos(angle), is = Math.sin(angle);
  for (let y = Math.ceil(minY / spacing) * spacing; y <= maxY; y += spacing) {
    const xs = [];
    for (let i = 0; i < rp.length; i++) {
      const a = rp[i], b = rp[(i + 1) % rp.length];
      if ((a[1] <= y && b[1] > y) || (b[1] <= y && a[1] > y)) {
        xs.push(a[0] + (y - a[1]) / (b[1] - a[1]) * (b[0] - a[0]));
      }
    }
    if (xs.length < 2) continue;
    xs.sort((m, n) => m - n);
    for (let i = 0; i + 1 < xs.length; i += 2) {
      const p1 = [xs[i]*ic - y*is, xs[i]*is + y*ic];
      const p2 = [xs[i+1]*ic - y*is, xs[i+1]*is + y*ic];
      out.push({ t:'line', p:[p1, p2], c:'ink', w:width });
    }
  }
}

const rand2 = (x, y) => { const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return n - Math.floor(n); };

function convexDots(pts, spacing, out, r) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const p of pts) {
    if (p[0] < x0) x0 = p[0]; if (p[0] > x1) x1 = p[0];
    if (p[1] < y0) y0 = p[1]; if (p[1] > y1) y1 = p[1];
  }
  const cols = (x1 - x0) / spacing, rows = (y1 - y0) / spacing;
  if (!isFinite(cols) || cols * rows > 5000) return;
  for (let gy = 0; gy <= rows; gy++) {
    for (let gx = 0; gx <= cols; gx++) {
      const px = x0 + (gx + (rand2(gx, gy) - 0.5) * 0.9) * spacing;
      const py = y0 + (gy + (rand2(gy, gx) - 0.5) * 0.9) * spacing;
      if (inPoly(px, py, pts)) out.push({ t:'dot', x:px, y:py, r });
    }
  }
}

function inPoly(x, y, pts) {
  let inside = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const a = pts[i], b = pts[j];
    if ((a[1] > y) !== (b[1] > y) &&
        x < (b[0] - a[0]) * (y - a[1]) / (b[1] - a[1]) + a[0]) inside = !inside;
  }
  return inside;
}

/* ---------------------------------------------------------- the renderer */
// Produces a flat list of drawing ops. Canvas and SVG both consume this list,
// so the exported stencil is the same drawing the screen shows.
function buildOps(opt) {
  const { w, h, lw, exportMode, draft } = opt;
  const ops = [], pick = [];
  const cx = w / 2, cy = h / 2;
  const focal = Math.min(w, h) * 1.15;
  const scale = focal / S.cam.dist;

  const project = v => {
    if (S.style.proj === 'ortho') return [cx + v[0] * scale, cy - v[1] * scale, S.cam.dist - v[2]];
    const d = Math.max(0.35, S.cam.dist - v[2]);
    return [cx + v[0] * focal / d, cy - v[1] * focal / d, d];
  };

  const la = S.style.light * TAU;
  const L = (() => {
    const v = [Math.cos(la) * 0.75, 0.6, Math.sin(la) * 0.75];
    const m = Math.hypot(v[0], v[1], v[2]);
    return [v[0]/m, v[1]/m, v[2]/m];
  })();

  const mode = S.style.mode;
  const fill = draft ? 'open' : S.style.fill;
  const solidPass = mode !== 'wire';
  const patOnly = S.pat.kind && S.pat.layer === 'only';

  /* Ground construction grid — a drafting reference, never exported. A
     visible pattern already gives the eye a ground, so stand the grid down
     rather than crosshatching the two together. */
  const patShown = S.pat.kind && S.pat.layer !== 'off';
  if (S.style.grid && !exportMode && !patShown) {
    for (const r of [1.6, 3.2, 4.8]) {
      const pts = [];
      for (let i = 0; i <= 72; i++) {
        const a = i / 72 * TAU;
        pts.push(project(toView([Math.cos(a) * r, -2.2, Math.sin(a) * r])));
      }
      for (let i = 0; i + 1 < pts.length; i++) ops.push({ t:'line', p:[pts[i], pts[i+1]], c:'hair', w:lw * 0.5 });
    }
    for (let i = 0; i < 8; i++) {
      const a = i / 8 * TAU;
      const p1 = project(toView([Math.cos(a) * 1.6, -2.2, Math.sin(a) * 1.6]));
      const p2 = project(toView([Math.cos(a) * 4.8, -2.2, Math.sin(a) * 4.8]));
      ops.push({ t:'line', p:[p1, p2], c:'hair', w:lw * 0.5 });
    }
  }

  /* the flat panel the solids stand on */
  for (const o of patternOps(w, h, lw)) ops.push(o);
  if (patOnly) return { ops, pick };

  const insts = instances();
  const faces = [];
  const wireEdges = [];

  for (let si = 0; si < S.shapes.length; si++) {
    const sh = S.shapes[si];
    const g = geoFor(sh);
    const selected = sh.id === S.sel && !exportMode;

    for (const inst of insts) {
      // local -> world
      const world = g.v.map(p => {
        let q = rotZ(rotY(rotX(p, sh.rot[0]), sh.rot[1]), sh.rot[2]);
        q = [q[0] + sh.pos[0], q[1] + sh.pos[1], q[2] + sh.pos[2]];
        if (inst.mirror) q = [-q[0], q[1], q[2]];
        if (inst.spin) q = rotY(q, inst.spin);
        return q;
      });
      let ox = 0, oy = 0, oz = 0;
      for (const p of world) { ox += p[0]; oy += p[1]; oz += p[2]; }
      const k = 1 / world.length;
      const origin = [ox * k, oy * k, oz * k];

      const view = world.map(toView);
      const scr = view.map(project);
      const odepth = project(toView(origin))[2];

      const front = new Array(g.f.length);
      for (let fi = 0; fi < g.f.length; fi++) {
        const face = g.f[fi];
        const wp = face.map(i => world[i]);
        let n = newell(wp);
        let fx = 0, fy = 0, fz = 0;
        for (const p of wp) { fx += p[0]; fy += p[1]; fz += p[2]; }
        const fk = 1 / wp.length;
        const fc = [fx * fk, fy * fk, fz * fk];
        if (n[0]*(fc[0]-origin[0]) + n[1]*(fc[1]-origin[1]) + n[2]*(fc[2]-origin[2]) < 0) n = [-n[0], -n[1], -n[2]];

        const nv = toView(n);
        const vc = face.reduce((acc, i) => [acc[0]+view[i][0], acc[1]+view[i][1], acc[2]+view[i][2]], [0,0,0]).map(x => x * fk);
        const toCam = S.style.proj === 'ortho' ? [0, 0, 1] : [-vc[0], -vc[1], S.cam.dist - vc[2]];
        const isFront = nv[0]*toCam[0] + nv[1]*toCam[1] + nv[2]*toCam[2] > 0;
        front[fi] = isFront;
        if (!solidPass || !isFront) continue;

        const pts = face.map(i => [scr[i][0], scr[i][1]]);
        let depth = 0;
        for (const i of face) depth += scr[i][2];
        depth *= fk;

        const bright = clamp((n[0]*L[0] + n[1]*L[1] + n[2]*L[2]) * 0.5 + 0.5, 0, 1);
        faces.push({ pts, depth, odepth, bright, sel:selected, edges:face, scr, shapeIdx:si });
      }

      if (mode === 'wire') {
        for (const [a, b] of g.e) wireEdges.push({ p:[scr[a], scr[b]], sel:selected, ghost:false });
      } else if (mode === 'ghost') {
        // an edge is hidden when neither face it borders turns toward the camera;
        // the visible ones are already stroked by the solid pass
        for (let ei = 0; ei < g.e.length; ei++) {
          let vis = false;
          for (const fi of g.ef[ei]) if (front[fi]) { vis = true; break; }
          if (!vis) wireEdges.push({ p:[scr[g.e[ei][0]], scr[g.e[ei][1]]], sel:selected, ghost:true });
        }
      }
    }
  }

  // Sort whole forms before their faces. Painter's on a flat face list puts one
  // solid's near face behind another's far face whenever their spans overlap;
  // resolving the form first keeps separated solids stacking correctly.
  faces.sort((a, b) => (b.odepth - a.odepth) || (b.depth - a.depth));

  const tone = S.style.tone;
  for (const f of faces) {
    pick.push({ pts:f.pts, depth:f.depth, shapeIdx:f.shapeIdx });

    if (fill === 'black' && f.bright < 0.15 + tone * 0.6) {
      ops.push({ t:'poly', pts:f.pts, f:'ink' });
    } else {
      ops.push({ t:'poly', pts:f.pts, f:'paper' });
      if (fill === 'hatch') {
        const base = 13 - tone * 9.2;
        const sp = clamp(base * (0.35 + f.bright * 1.75), 2.2, 42) * lw;
        const ang = Math.atan2(f.pts[1][1] - f.pts[0][1], f.pts[1][0] - f.pts[0][0]) + 0.85;
        convexHatch(f.pts, ang, sp, ops, lw * 0.72);
      } else if (fill === 'dots') {
        const base = 12 - tone * 7.6;
        const sp = clamp(base * (0.45 + f.bright * 1.7), 3, 40) * lw;
        convexDots(f.pts, sp, ops, lw * 0.62);
      }
    }

    const wgt = S.style.weight * lw * (f.sel ? 1.55 : 1);
    for (let i = 0; i < f.edges.length; i++) {
      const a = f.scr[f.edges[i]], b = f.scr[f.edges[(i + 1) % f.edges.length]];
      ops.push({ t:'line', p:[a, b], c: f.sel ? 'accent' : 'ink', w:wgt });
    }
  }

  for (const e of wireEdges) {
    ops.push({
      t:'line', p:e.p,
      c: e.sel ? 'accent' : (e.ghost ? 'ghost' : 'ink'),
      w: S.style.weight * lw * (e.ghost ? 0.6 : e.sel ? 1.55 : 1),
      dash: e.ghost
    });
  }

  return { ops, pick };
}

/* ---------------------------------------------------------- painters */
function paint(ctx, ops, col, w, h) {
  ctx.save();
  ctx.fillStyle = col.paper;
  ctx.fillRect(0, 0, w, h);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (const o of ops) {
    if (o.t === 'poly') {
      ctx.beginPath();
      ctx.moveTo(o.pts[0][0], o.pts[0][1]);
      for (let i = 1; i < o.pts.length; i++) ctx.lineTo(o.pts[i][0], o.pts[i][1]);
      ctx.closePath();
      ctx.fillStyle = o.f === 'ink' ? col.ink : col.paper;
      ctx.fill();
    } else if (o.t === 'line') {
      ctx.beginPath();
      ctx.moveTo(o.p[0][0], o.p[0][1]);
      ctx.lineTo(o.p[1][0], o.p[1][1]);
      ctx.strokeStyle = o.c === 'accent' ? col.accent : o.c === 'ghost' ? col.ghost : o.c === 'hair' ? col.hair : col.ink;
      ctx.lineWidth = o.w;
      ctx.setLineDash(o.dash ? [3, 4] : []);
      ctx.stroke();
    } else if (o.t === 'dot') {
      ctx.beginPath();
      ctx.arc(o.x, o.y, o.r, 0, TAU);
      ctx.fillStyle = col.ink;
      ctx.fill();
    }
  }
  ctx.setLineDash([]);
  ctx.restore();
}

function toSVG(ops, w, h, col) {
  const n = v => Math.round(v * 100) / 100;
  const out = [`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`];
  out.push(`<rect width="${w}" height="${h}" fill="${col.paper}"/>`);
  out.push(`<g stroke-linecap="round" stroke-linejoin="round">`);
  for (const o of ops) {
    if (o.t === 'poly') {
      const d = o.pts.map(p => `${n(p[0])},${n(p[1])}`).join(' ');
      out.push(`<polygon points="${d}" fill="${o.f === 'ink' ? col.ink : col.paper}"/>`);
    } else if (o.t === 'line') {
      const c = o.c === 'ghost' ? col.ghost : o.c === 'hair' ? col.hair : col.ink;
      out.push(`<line x1="${n(o.p[0][0])}" y1="${n(o.p[0][1])}" x2="${n(o.p[1][0])}" y2="${n(o.p[1][1])}" stroke="${c}" stroke-width="${n(o.w)}"${o.dash ? ' stroke-dasharray="3 4"' : ''}/>`);
    } else if (o.t === 'dot') {
      out.push(`<circle cx="${n(o.x)}" cy="${n(o.y)}" r="${n(o.r)}" fill="${col.ink}"/>`);
    }
  }
  out.push('</g></svg>');
  return out.join('\n');
}

/* =====================================================================
   Flat pattern work. These are screen-space, not projected — a 2D panel
   the solids sit on top of. They emit the same ops as the 3D renderer,
   so they clip, paint and export as stencils through the same path.
   ===================================================================== */
const rngFor = seed => {
  let s = (seed >>> 0) || 1;
  return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
};

// flat-top hexagon: vertices at 60° steps, so the lattice below tiles cleanly
function hexPts(cx, cy, R, rot) {
  const o = [];
  for (let k = 0; k < 6; k++) { const a = rot + k * Math.PI / 3; o.push([cx + Math.cos(a) * R, cy + Math.sin(a) * R]); }
  return o;
}

// axial hex coordinates within `N` rings, rotated as a whole
function hexLattice(N, R, rot) {
  const out = [], c = Math.cos(rot), s = Math.sin(rot), rt3 = Math.sqrt(3);
  for (let q = -N; q <= N; q++) {
    for (let r = Math.max(-N, -q - N); r <= Math.min(N, -q + N); r++) {
      const x = R * 1.5 * q, y = R * rt3 * (r + q / 2);
      out.push([x * c - y * s, x * s + y * c]);
    }
  }
  return out;
}

// triangular lattice of pitch R — circle centres for Flower, Scales
function triLattice(N, R, rot) {
  const out = [], c = Math.cos(rot), s = Math.sin(rot), rt3 = Math.sqrt(3), lim = (N + 0.01) * R;
  for (let q = -N - 1; q <= N + 1; q++) {
    for (let r = -N - 1; r <= N + 1; r++) {
      const x = R * (q + r / 2), y = R * r * rt3 / 2;
      if (Math.hypot(x, y) > lim) continue;
      out.push([x * c - y * s, x * s + y * c]);
    }
  }
  return out;
}

const lerpP = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];

// the six axial steps, indexed to match hexagon edges: edge k has its outward
// normal at 30 + 60k degrees, and the neighbour across it is DIRS[k]
const DIRS = [[1, 0], [0, 1], [-1, 1], [-1, 0], [0, -1], [1, -1]];
const inRing = (q, r, N) => Math.abs(q) <= N && Math.abs(r) <= N && Math.abs(q + r) <= N;
const axialPx = (q, r, R, rot, cx, cy) => {
  const lx = R * 1.5 * q, ly = R * Math.sqrt(3) * (r + q / 2);
  const c = Math.cos(rot), s = Math.sin(rot);
  return [cx + lx * c - ly * s, cy + lx * s + ly * c];
};

function arcSegs(out, c, p1, p2, r) {
  let a1 = Math.atan2(p1[1] - c[1], p1[0] - c[0]);
  let a2 = Math.atan2(p2[1] - c[1], p2[0] - c[0]);
  let d = a2 - a1;
  while (d > Math.PI) d -= TAU;
  while (d < -Math.PI) d += TAU;
  const n = 10;
  let prev = p1;
  for (let i = 1; i <= n; i++) {
    const a = a1 + d * (i / n);
    const p = [c[0] + Math.cos(a) * r, c[1] + Math.sin(a) * r];
    out.push([prev, p]); prev = p;
  }
}

function circleSegs(out, cx, cy, r, n) {
  let prev = null;
  for (let i = 0; i <= n; i++) {
    const a = i / n * TAU, p = [cx + Math.cos(a) * r, cy + Math.sin(a) * r];
    if (prev) out.push([prev, p]);
    prev = p;
  }
}

const PATTERNS = {
  honeycomb: {
    label: 'Honeycomb', params: ['scale', 'rings', 'rot', 'dens', 'seed'], densLabel: 'Inner cells',
    gen(c) {
      const segs = [], seen = new Set(), rnd = rngFor(c.seed);
      for (const [x, y] of hexLattice(c.rings, c.R, c.rot)) {
        const X = x + c.cx, Y = y + c.cy, v = hexPts(X, Y, c.R, c.rot);
        for (let k = 0; k < 6; k++) {
          const a = v[k], b = v[(k + 1) % 6];
          // neighbours share a wall; key on the midpoint so it's stroked once
          const key = Math.round((a[0] + b[0]) / 2) + ':' + Math.round((a[1] + b[1]) / 2);
          if (seen.has(key)) continue;
          seen.add(key); segs.push([a, b]);
        }
        if (rnd() < c.dens) {
          const iv = hexPts(X, Y, c.R * 0.6, c.rot);
          for (let k = 0; k < 6; k++) segs.push([iv[k], iv[(k + 1) % 6]]);
        }
      }
      return { segs, polys: [] };
    }
  },

  cubes: {
    label: 'Cubes', params: ['scale', 'rings', 'rot', 'dens', 'seed'], densLabel: 'Solid faces',
    gen(c) {
      // rhombille: each hexagon splits into three rhombi and reads as a cube
      const segs = [], polys = [], seen = new Set(), rnd = rngFor(c.seed);
      for (const [x, y] of hexLattice(c.rings, c.R, c.rot)) {
        const X = x + c.cx, Y = y + c.cy, v = hexPts(X, Y, c.R, c.rot);
        for (let k = 0; k < 6; k++) {
          const a = v[k], b = v[(k + 1) % 6];
          const key = Math.round((a[0] + b[0]) / 2) + ':' + Math.round((a[1] + b[1]) / 2);
          if (seen.has(key)) continue;
          seen.add(key); segs.push([a, b]);
        }
        for (let k = 0; k < 6; k += 2) {
          segs.push([[X, Y], v[k]]);
          if (rnd() < c.dens) polys.push([[X, Y], v[k], v[(k + 1) % 6], v[(k + 2) % 6]]);
        }
      }
      return { segs, polys };
    }
  },

  triangles: {
    label: 'Triangle', params: ['scale', 'rings', 'rot'],
    gen(c) {
      const segs = [], L = c.R * (c.rings + 2) * 2, sp = c.R * Math.sqrt(3) / 2;
      for (let f = 0; f < 3; f++) {
        const a = c.rot + f * Math.PI / 3;
        const d = [Math.cos(a), Math.sin(a)], n = [-Math.sin(a), Math.cos(a)];
        const M = Math.ceil(L / sp);
        for (let k = -M; k <= M; k++) {
          const px = c.cx + n[0] * k * sp, py = c.cy + n[1] * k * sp;
          segs.push([[px - d[0] * L, py - d[1] * L], [px + d[0] * L, py + d[1] * L]]);
        }
      }
      return { segs, polys: [] };
    }
  },

  flower: {
    label: 'Flower', params: ['scale', 'rings', 'rot'],
    gen(c) {
      // Flower of Life: equal circles on a triangular lattice of the same pitch
      const segs = [];
      for (const [x, y] of triLattice(c.rings, c.R, c.rot)) {
        circleSegs(segs, c.cx + x, c.cy + y, c.R, 48);
      }
      return { segs, polys: [] };
    }
  },

  metatron: {
    label: 'Metatron', params: ['scale', 'rot'],
    gen(c) {
      // thirteen circles, then every centre joined to every other.
      // The figure is a fixed 13-circle construction, so it takes its size
      // from the cell slider alone — widened so it fills the frame like the
      // tiling patterns do at the same setting.
      const segs = [], d = c.R * 2.2, P = [[c.cx, c.cy]];
      for (const m of [1, 2]) {
        for (let k = 0; k < 6; k++) {
          const a = c.rot + k * Math.PI / 3;
          P.push([c.cx + Math.cos(a) * d * m, c.cy + Math.sin(a) * d * m]);
        }
      }
      for (let i = 0; i < P.length; i++) for (let j = i + 1; j < P.length; j++) segs.push([P[i], P[j]]);
      for (const p of P) circleSegs(segs, p[0], p[1], d / 2, 40);
      return { segs, polys: [] };
    }
  },

  star: {
    label: 'Star', params: ['scale', 'rings', 'rot', 'dens'], densLabel: 'Sharpness',
    gen(c) {
      // Nested star polygons on twelve points, each ring circumscribed.
      // Sharpness picks the chord skip: {12/2} reads as stacked hexagons,
      // {12/5} as a sharp compass star.
      const segs = [], N = Math.max(2, c.rings), P = 12;
      const step = 2 + Math.round(c.dens * 3);
      for (let i = 1; i <= N; i++) {
        const r = c.R * i, V = [];
        for (let k = 0; k < P; k++) {
          const a = c.rot + k / P * TAU;
          V.push([c.cx + Math.cos(a) * r, c.cy + Math.sin(a) * r]);
        }
        for (let k = 0; k < P; k++) segs.push([V[k], V[(k + step) % P]]);
        circleSegs(segs, c.cx, c.cy, r, 60);
      }
      return { segs, polys: [] };
    }
  },

  truchet: {
    label: 'Truchet', params: ['scale', 'rings', 'rot', 'seed'],
    gen(c) {
      // pair each cell's six wall midpoints at random; adjacent pairs arc
      // around their shared corner, the rest run straight across
      const segs = [], rnd = rngFor(c.seed);
      for (const [x, y] of hexLattice(c.rings, c.R, c.rot)) {
        const X = x + c.cx, Y = y + c.cy, v = hexPts(X, Y, c.R, c.rot), mid = [];
        for (let k = 0; k < 6; k++) mid.push([(v[k][0] + v[(k + 1) % 6][0]) / 2, (v[k][1] + v[(k + 1) % 6][1]) / 2]);
        const idx = [0, 1, 2, 3, 4, 5];
        for (let i = 5; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const t = idx[i]; idx[i] = idx[j]; idx[j] = t; }
        for (let t = 0; t < 6; t += 2) {
          const i = idx[t], j = idx[t + 1], diff = (j - i + 6) % 6;
          if (diff === 1) arcSegs(segs, v[j], mid[i], mid[j], c.R / 2);
          else if (diff === 5) arcSegs(segs, v[i], mid[i], mid[j], c.R / 2);
          else segs.push([mid[i], mid[j]]);
        }
      }
      return { segs, polys: [] };
    }
  },

  weave: {
    label: 'Weave', params: ['scale', 'rings', 'rot', 'dens'], densLabel: 'Band width',
    gen(c) {
      // Triaxial weave. Three band families; each passes over the next and
      // under the one after, so the over/under cycles consistently. A band
      // edge is drawn minus the spans where it runs beneath another band.
      // Band width has to stay well under the spacing: at much past a third,
      // a band's two edges sit as far apart as the visible runs are long and
      // the ribbon stops reading as one thing.
      const segs = [], L = c.R * (c.rings + 2) * 2, sp = c.R * 1.4;
      const hw = sp * (0.1 + c.dens * 0.14);
      const fam = [];
      for (let f = 0; f < 3; f++) {
        const a = c.rot + f * Math.PI / 3;
        fam.push({ d: [Math.cos(a), Math.sin(a)], n: [-Math.sin(a), Math.cos(a)] });
      }
      const M = Math.ceil(L / sp);
      for (let f = 0; f < 3; f++) {
        const F = fam[f], G = fam[(f + 2) % 3];
        for (let k = -M; k <= M; k++) {
          for (const side of [-1, 1]) {
            const off = k * sp + side * hw;
            const px = c.cx + F.n[0] * off, py = c.cy + F.n[1] * off;
            const a = [px - F.d[0] * L, py - F.d[1] * L];
            const b = [px + F.d[0] * L, py + F.d[1] * L];
            const den = G.n[0] * (b[0] - a[0]) + G.n[1] * (b[1] - a[1]);
            const cuts = [];
            if (Math.abs(den) > 1e-9) {
              for (let m = -M; m <= M; m++) {
                const qx = c.cx + G.n[0] * m * sp, qy = c.cy + G.n[1] * m * sp;
                const base = G.n[0] * (a[0] - qx) + G.n[1] * (a[1] - qy);
                let t1 = (-hw - base) / den, t2 = (hw - base) / den;
                if (t1 > t2) { const t = t1; t1 = t2; t2 = t; }
                if (t2 < 0 || t1 > 1) continue;
                cuts.push([Math.max(0, t1), Math.min(1, t2)]);
              }
            }
            cuts.sort((x, y) => x[0] - y[0]);
            let t = 0;
            for (const [c1, c2] of cuts) {
              if (c1 > t) segs.push([lerpP(a, b, t), lerpP(a, b, c1)]);
              if (c2 > t) t = c2;
            }
            if (t < 1) segs.push([lerpP(a, b, t), lerpP(a, b, 1)]);
          }
        }
      }
      return { segs, polys: [] };
    }
  },

  maze: {
    label: 'Maze', params: ['scale', 'rings', 'rot', 'seed'],
    gen(c) {
      // randomised depth-first carve over the hex cells, then every wall
      // that was never opened gets drawn
      const N = Math.max(1, c.rings), rnd = rngFor(c.seed), key = (q, r) => q + ',' + r;
      const cells = new Set();
      for (let q = -N; q <= N; q++) {
        for (let r = Math.max(-N, -q - N); r <= Math.min(N, -q + N); r++) cells.add(key(q, r));
      }
      const seen = new Set([key(0, 0)]), open = new Set(), stack = [[0, 0]];
      while (stack.length) {
        const [q, r] = stack[stack.length - 1], opts = [];
        for (let d = 0; d < 6; d++) {
          const nk = key(q + DIRS[d][0], r + DIRS[d][1]);
          if (cells.has(nk) && !seen.has(nk)) opts.push(d);
        }
        if (!opts.length) { stack.pop(); continue; }
        const d = opts[Math.floor(rnd() * opts.length)];
        const nq = q + DIRS[d][0], nr = r + DIRS[d][1];
        open.add(key(q, r) + '|' + d);
        open.add(key(nq, nr) + '|' + ((d + 3) % 6));
        seen.add(key(nq, nr));
        stack.push([nq, nr]);
      }
      const segs = [], drawn = new Set(), rt3 = Math.sqrt(3);
      const cs = Math.cos(c.rot), sn = Math.sin(c.rot);
      for (let q = -N; q <= N; q++) {
        for (let r = Math.max(-N, -q - N); r <= Math.min(N, -q + N); r++) {
          const lx = c.R * 1.5 * q, ly = c.R * rt3 * (r + q / 2);
          const X = c.cx + lx * cs - ly * sn, Y = c.cy + lx * sn + ly * cs;
          const v = hexPts(X, Y, c.R, c.rot);
          for (let d = 0; d < 6; d++) {
            if (open.has(key(q, r) + '|' + d)) continue;
            const a = v[d], b = v[(d + 1) % 6];
            const mk = Math.round((a[0] + b[0]) / 2) + ':' + Math.round((a[1] + b[1]) / 2);
            if (drawn.has(mk)) continue;
            drawn.add(mk); segs.push([a, b]);
          }
        }
      }
      return { segs, polys: [] };
    }
  },

  fracture: {
    label: 'Fracture', params: ['scale', 'rings', 'rot', 'dens', 'seed'], densLabel: 'Distortion',
    gen(c) {
      // honeycomb with every corner pushed off true. Shared corners must move
      // together or the cells tear apart, so the offset is memoised on the
      // corner's own position rather than drawn per cell.
      const segs = [], seen = new Set(), moved = new Map(), amt = c.dens * c.R * 0.42;
      const jit = p => {
        const k = Math.round(p[0] * 2) + ':' + Math.round(p[1] * 2);
        let q = moved.get(k);
        if (!q) {
          const h1 = Math.sin(p[0] * 127.1 + p[1] * 311.7 + c.seed) * 43758.5453;
          const h2 = Math.sin(p[0] * 269.5 + p[1] * 183.3 + c.seed) * 43758.5453;
          q = [p[0] + ((h1 - Math.floor(h1)) - 0.5) * amt * 2,
               p[1] + ((h2 - Math.floor(h2)) - 0.5) * amt * 2];
          moved.set(k, q);
        }
        return q;
      };
      for (const [x, y] of hexLattice(c.rings, c.R, c.rot)) {
        const v = hexPts(x + c.cx, y + c.cy, c.R, c.rot).map(jit);
        for (let k = 0; k < 6; k++) {
          const a = v[k], b = v[(k + 1) % 6];
          const mk = Math.round((a[0] + b[0]) / 2) + ':' + Math.round((a[1] + b[1]) / 2);
          if (seen.has(mk)) continue;
          seen.add(mk); segs.push([a, b]);
        }
      }
      return { segs, polys: [] };
    }
  },

  scales: {
    label: 'Scales', params: ['scale', 'rings', 'rot', 'dens'], densLabel: 'Sweep',
    gen(c) {
      // arcs cover less of each cell than Flower's full circles, so reach
      // wider than the nominal extent or the frame corners come up bare
      const segs = [], span = Math.PI * (0.55 + c.dens * 0.75), n = 20;
      for (const [x, y] of triLattice(c.rings + 2, c.R, c.rot)) {
        const X = c.cx + x, Y = c.cy + y;
        const a0 = c.rot + Math.PI / 2 - span / 2, a1 = c.rot + Math.PI / 2 + span / 2;
        let prev = null;
        for (let i = 0; i <= n; i++) {
          const a = a0 + (a1 - a0) * i / n;
          const p = [X + Math.cos(a) * c.R, Y + Math.sin(a) * c.R];
          if (prev) segs.push([prev, p]);
          prev = p;
        }
      }
      return { segs, polys: [] };
    }
  },

  halftone: {
    label: 'Halftone', params: ['scale', 'rings', 'rot', 'dens'], densLabel: 'Falloff',
    gen(c) {
      // solid cells shrinking with radius — a dotwork gradient in hex form
      const polys = [], maxD = c.R * Math.max(1, c.rings) * 1.7;
      for (const [x, y] of hexLattice(c.rings, c.R, c.rot)) {
        const f = 1 - Math.pow(Math.min(1, Math.hypot(x, y) / maxD), 1 + c.dens * 3);
        if (f <= 0.04) continue;
        polys.push(hexPts(x + c.cx, y + c.cy, c.R * 0.9 * f, c.rot));
      }
      return { segs: [], polys };
    }
  },

  kagome: {
    label: 'Kagome', params: ['scale', 'rings', 'rot'],
    gen(c) {
      // Trihexagonal tiling: join each cell's wall midpoints into a hexagon.
      // Neighbours share those midpoints, so the gaps left around the original
      // corners close up as triangles and the lattice comes out interlocked.
      const segs = [], seen = new Set();
      for (const [x, y] of hexLattice(c.rings, c.R, c.rot)) {
        const v = hexPts(x + c.cx, y + c.cy, c.R, c.rot), mid = [];
        for (let k = 0; k < 6; k++) {
          mid.push([(v[k][0] + v[(k + 1) % 6][0]) / 2, (v[k][1] + v[(k + 1) % 6][1]) / 2]);
        }
        for (let k = 0; k < 6; k++) {
          const a = mid[k], b = mid[(k + 1) % 6];
          const mk = Math.round((a[0] + b[0]) / 2) + ':' + Math.round((a[1] + b[1]) / 2);
          if (seen.has(mk)) continue;
          seen.add(mk); segs.push([a, b]);
        }
      }
      return { segs, polys: [] };
    }
  },

  spiral: {
    label: 'Spiral', params: ['scale', 'rings', 'rot', 'dens'], densLabel: 'Growth',
    gen(c) {
      const segs = [], turns = Math.max(2, c.rings), steps = turns * 6;
      const growth = 0.3 + c.dens * 1.1, pts = [];
      for (let i = 0; i <= steps; i++) {
        const a = c.rot + i * TAU / 6, r = c.R * (0.3 + i * growth / 3.2);
        pts.push([c.cx + Math.cos(a) * r, c.cy + Math.sin(a) * r]);
      }
      for (let i = 0; i + 1 < pts.length; i++) segs.push([pts[i], pts[i + 1]]);
      for (let i = 0; i + 6 < pts.length; i++) segs.push([pts[i], pts[i + 6]]);
      return { segs, polys: [] };
    }
  },

  sierpinski: {
    label: 'Sierpinski', params: ['scale', 'rings', 'rot'],
    gen(c) {
      const segs = [], depth = Math.min(6, Math.max(1, c.rings)), R = c.R * 3.2;
      const V = [];
      for (let k = 0; k < 3; k++) {
        const a = c.rot - Math.PI / 2 + k * TAU / 3;
        V.push([c.cx + Math.cos(a) * R, c.cy + Math.sin(a) * R]);
      }
      const mid = (x, y) => [(x[0] + y[0]) / 2, (x[1] + y[1]) / 2];
      (function rec(p1, p2, p3, d) {
        if (!d) { segs.push([p1, p2], [p2, p3], [p3, p1]); return; }
        const a = mid(p1, p2), b = mid(p2, p3), e = mid(p3, p1);
        rec(p1, a, e, d - 1); rec(a, p2, b, d - 1); rec(e, b, p3, d - 1);
      })(V[0], V[1], V[2], depth);
      return { segs, polys: [] };
    }
  },

  snowflake: {
    label: 'Snowflake', params: ['scale', 'rings', 'rot'],
    gen(c) {
      // Koch construction on each side of a hexagon
      const depth = Math.min(4, Math.max(1, c.rings)), R = c.R * 3.2;
      let pts = [];
      for (let k = 0; k < 6; k++) {
        const a = c.rot + k * TAU / 6;
        pts.push([c.cx + Math.cos(a) * R, c.cy + Math.sin(a) * R]);
      }
      for (let d = 0; d < depth; d++) {
        const out = [];
        for (let i = 0; i < pts.length; i++) {
          const a = pts[i], b = pts[(i + 1) % pts.length];
          const dx = (b[0] - a[0]) / 3, dy = (b[1] - a[1]) / 3, len = Math.hypot(dx, dy);
          const p1 = [a[0] + dx, a[1] + dy], p2 = [a[0] + 2 * dx, a[1] + 2 * dy];
          const ang = Math.atan2(dy, dx) - Math.PI / 3;
          out.push(a, p1, [p1[0] + Math.cos(ang) * len, p1[1] + Math.sin(ang) * len], p2);
        }
        pts = out;
      }
      const segs = [];
      for (let i = 0; i < pts.length; i++) segs.push([pts[i], pts[(i + 1) % pts.length]]);
      return { segs, polys: [] };
    }
  },

  gosper: {
    label: 'Gosper', params: ['scale', 'rings', 'rot'],
    gen(c) {
      // flowsnake L-system, turned 60° at a time, then fitted to the frame
      const depth = Math.min(4, Math.max(1, c.rings));
      let s = 'A';
      for (let i = 0; i < depth; i++) {
        let o = '';
        for (const ch of s) {
          o += ch === 'A' ? 'A-B--B+A++AA+B-' : ch === 'B' ? '+A-BB--B-A++A+B' : ch;
        }
        s = o;
      }
      let a = c.rot, x = 0, y = 0;
      const pts = [[0, 0]];
      for (const ch of s) {
        if (ch === 'A' || ch === 'B') { x += Math.cos(a); y += Math.sin(a); pts.push([x, y]); }
        else if (ch === '+') a += Math.PI / 3;
        else if (ch === '-') a -= Math.PI / 3;
      }
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      for (const p of pts) {
        if (p[0] < x0) x0 = p[0]; if (p[0] > x1) x1 = p[0];
        if (p[1] < y0) y0 = p[1]; if (p[1] > y1) y1 = p[1];
      }
      const k = c.R * 6 / Math.max(x1 - x0, y1 - y0, 1e-6);
      const ox = c.cx - (x0 + x1) / 2 * k, oy = c.cy - (y0 + y1) / 2 * k;
      const segs = [];
      for (let i = 0; i + 1 < pts.length; i++) {
        segs.push([[pts[i][0] * k + ox, pts[i][1] * k + oy],
                   [pts[i + 1][0] * k + ox, pts[i + 1][1] * k + oy]]);
      }
      return { segs, polys: [] };
    }
  },

  truncated: {
    label: 'Truncated', params: ['scale', 'rings', 'rot', 'dens'], densLabel: 'Cut',
    gen(c) {
      // corners cut off every cell: hexagons become dodecagons and the old
      // corners open into triangles. At a third, it's the regular tiling.
      const segs = [], seen = new Set(), t = 0.14 + c.dens * 0.26;
      for (const [x, y] of hexLattice(c.rings, c.R, c.rot)) {
        const v = hexPts(x + c.cx, y + c.cy, c.R, c.rot), P = [];
        for (let k = 0; k < 6; k++) {
          const a = v[k], b = v[(k + 1) % 6];
          P.push(lerpP(a, b, t), lerpP(a, b, 1 - t));
        }
        for (let k = 0; k < 12; k++) {
          const a = P[k], b = P[(k + 1) % 12];
          const mk = Math.round((a[0] + b[0]) / 2) + ':' + Math.round((a[1] + b[1]) / 2);
          if (seen.has(mk)) continue;
          seen.add(mk); segs.push([a, b]);
        }
      }
      return { segs, polys: [] };
    }
  },

  chain: {
    label: 'Chain', params: ['scale', 'rings', 'rot', 'dens'], densLabel: 'Ring size',
    gen(c) {
      // Interlocking rings. A ring passes under its neighbours in the odd
      // axial directions and over the even ones. Direction d from one cell
      // is d+3 from the other, which flips parity, so exactly one ring of
      // each pair breaks — and the three breaks land 120° apart, so every
      // ring alternates over and under the way real mail does. Splitting
      // them 0-2 against 3-5 is equally consistent but puts all three
      // breaks on one side, which just reads as overlapping scales.
      const segs = [], N = c.rings, rr = c.R * (0.95 + c.dens * 0.35), STEP = 84;
      for (let q = -N; q <= N; q++) {
        for (let r = Math.max(-N, -q - N); r <= Math.min(N, -q + N); r++) {
          const [X, Y] = axialPx(q, r, c.R, c.rot, c.cx, c.cy);
          const skips = [];
          for (const d of [1, 3, 5]) {
            const nq = q + DIRS[d][0], nr = r + DIRS[d][1];
            if (!inRing(nq, nr, N)) continue;
            const [NX, NY] = axialPx(nq, nr, c.R, c.rot, c.cx, c.cy);
            const dx = NX - X, dy = NY - Y, dist = Math.hypot(dx, dy);
            if (dist >= 2 * rr) continue;
            // Two equal circles meet at base ± half. Break only a short
            // window at each crossing — erasing the whole overlap lens
            // takes 216° off every ring and leaves loose arcs, not mail.
            const half = Math.acos(dist / (2 * rr)), base = Math.atan2(dy, dx), g = 0.11;
            skips.push([base - half - g, 2 * g], [base + half - g, 2 * g]);
          }
          let prev = null;
          for (let i = 0; i <= STEP; i++) {
            const a = c.rot + i / STEP * TAU;
            const p = [X + Math.cos(a) * rr, Y + Math.sin(a) * rr];
            let hid = false;
            for (const [s, w] of skips) {
              if ((((a - s) % TAU) + TAU) % TAU <= w) { hid = true; break; }
            }
            if (prev && !hid) segs.push([prev, p]);
            prev = p;
          }
        }
      }
      return { segs, polys: [] };
    }
  },

  hexagram: {
    label: 'Hexagram', params: ['scale', 'rings', 'rot', 'dens'], densLabel: 'Star size',
    gen(c) {
      // neighbours sit R√3 apart, so stars meet point-to-point near 0.87R
      const segs = [], rr = c.R * (0.45 + c.dens * 0.6);
      for (const [x, y] of hexLattice(c.rings, c.R, c.rot)) {
        const X = x + c.cx, Y = y + c.cy;
        for (const off of [0, Math.PI / 3]) {
          const V = [];
          for (let k = 0; k < 3; k++) {
            const a = c.rot + off + k * TAU / 3;
            V.push([X + Math.cos(a) * rr, Y + Math.sin(a) * rr]);
          }
          segs.push([V[0], V[1]], [V[1], V[2]], [V[2], V[0]]);
        }
      }
      return { segs, polys: [] };
    }
  },

  chevron: {
    label: 'Chevron', params: ['scale', 'rings', 'rot', 'dens'], densLabel: 'Pitch',
    gen(c) {
      const segs = [], L = c.R * (c.rings + 2) * 2;
      const period = c.R * (0.9 + c.dens * 1.4);
      const amp = period * Math.sqrt(3) / 4;   // legs at a true 60°
      const sp = c.R * 0.5;
      const a = c.rot, d = [Math.cos(a), Math.sin(a)], n = [-Math.sin(a), Math.cos(a)];
      const M = Math.ceil(L / sp), steps = Math.ceil(2 * L / period);
      for (let k = -M; k <= M; k++) {
        const ox = c.cx + n[0] * k * sp, oy = c.cy + n[1] * k * sp;
        let prev = null;
        for (let i = 0; i <= steps; i++) {
          const t = -L + i * period, z = (i % 2 ? amp : -amp);
          const p = [ox + d[0] * t + n[0] * z, oy + d[1] * t + n[1] * z];
          if (prev) segs.push([prev, p]);
          prev = p;
        }
      }
      return { segs, polys: [] };
    }
  },

  pinwheel: {
    label: 'Pinwheel', params: ['scale', 'rings', 'rot', 'dens', 'seed'], densLabel: 'Spin',
    gen(c) {
      const segs = [], rnd = rngFor(c.seed), seen = new Set();
      for (const [x, y] of hexLattice(c.rings, c.R, c.rot)) {
        const X = x + c.cx, Y = y + c.cy;
        const v = hexPts(X, Y, c.R, c.rot);
        for (let k = 0; k < 6; k++) {
          const a = v[k], b = v[(k + 1) % 6];
          const mk = Math.round((a[0] + b[0]) / 2) + ':' + Math.round((a[1] + b[1]) / 2);
          if (seen.has(mk)) continue;
          seen.add(mk); segs.push([a, b]);
        }
        const iv = hexPts(X, Y, c.R * 0.6, c.rot + (rnd() - 0.5) * c.dens * TAU / 6);
        for (let k = 0; k < 6; k++) { segs.push([iv[k], iv[(k + 1) % 6]], [iv[k], v[k]]); }
      }
      return { segs, polys: [] };
    }
  },

  circuit: {
    label: 'Circuit', params: ['scale', 'rings', 'rot', 'dens', 'seed'], densLabel: 'Density',
    gen(c) {
      // traces routed along the lattice, each ending in a pad
      const segs = [], rnd = rngFor(c.seed), N = c.rings, cells = [];
      for (let q = -N; q <= N; q++) {
        for (let r = Math.max(-N, -q - N); r <= Math.min(N, -q + N); r++) cells.push([q, r]);
      }
      const runs = Math.max(4, Math.round(cells.length * (0.5 + c.dens * 1.3)));
      for (let t = 0; t < runs; t++) {
        let [q, r] = cells[Math.floor(rnd() * cells.length)];
        const pts = [axialPx(q, r, c.R, c.rot, c.cx, c.cy)];
        let d = Math.floor(rnd() * 6);
        const len = 3 + Math.floor(rnd() * 6);
        for (let i = 0; i < len; i++) {
          if (rnd() < 0.45) d = (d + (rnd() < 0.5 ? 1 : 5)) % 6;
          const nq = q + DIRS[d][0], nr = r + DIRS[d][1];
          if (!inRing(nq, nr, N)) break;
          q = nq; r = nr;
          pts.push(axialPx(q, r, c.R, c.rot, c.cx, c.cy));
        }
        if (pts.length < 2) continue;
        for (let i = 0; i + 1 < pts.length; i++) segs.push([pts[i], pts[i + 1]]);
        for (const e of [pts[0], pts[pts.length - 1]]) circleSegs(segs, e[0], e[1], c.R * 0.2, 14);
      }
      return { segs, polys: [] };
    }
  },

  contour: {
    label: 'Contour', params: ['scale', 'rings', 'rot', 'dens', 'seed'], densLabel: 'Levels',
    gen(c) {
      // Three plane waves at 60° make a field with hexagonal symmetry;
      // marching squares pulls its level sets out as topographic lines.
      const segs = [], rnd = rngFor(c.seed);
      const ph = [rnd() * TAU, rnd() * TAU, rnd() * TAU], k1 = TAU / (c.R * 2.4), dirs = [];
      for (let f = 0; f < 3; f++) {
        const a = c.rot + f * Math.PI / 3;
        dirs.push([Math.cos(a), Math.sin(a)]);
      }
      const ext = c.R * (c.rings + 2), step = c.R * 0.3;
      const n = Math.ceil(2 * ext / step) + 1, F = new Float64Array(n * n);
      for (let j = 0; j < n; j++) {
        for (let i = 0; i < n; i++) {
          const x = -ext + i * step, y = -ext + j * step;
          let s = 0;
          for (let f = 0; f < 3; f++) s += Math.cos((x * dirs[f][0] + y * dirs[f][1]) * k1 + ph[f]);
          F[j * n + i] = s / 3;
        }
      }
      const levels = Math.max(2, Math.round(3 + c.dens * 7));
      const ip = (pa, pb, va, vb) => lerpP(pa, pb, va / (va - vb));
      for (let li = 0; li < levels; li++) {
        const lv = -0.85 + 1.7 * (li + 0.5) / levels;
        for (let j = 0; j + 1 < n; j++) {
          for (let i = 0; i + 1 < n; i++) {
            const v0 = F[j*n+i] - lv, v1 = F[j*n+i+1] - lv;
            const v2 = F[(j+1)*n+i+1] - lv, v3 = F[(j+1)*n+i] - lv;
            const idx = (v0 > 0 ? 1 : 0) | (v1 > 0 ? 2 : 0) | (v2 > 0 ? 4 : 0) | (v3 > 0 ? 8 : 0);
            if (idx === 0 || idx === 15) continue;
            const x = -ext + i * step, y = -ext + j * step;
            const A = [x, y], B = [x + step, y], C = [x + step, y + step], D = [x, y + step];
            const eAB = () => ip(A, B, v0, v1), eBC = () => ip(B, C, v1, v2);
            const eCD = () => ip(C, D, v2, v3), eDA = () => ip(D, A, v3, v0);
            const P = (p, q) => segs.push([[p[0] + c.cx, p[1] + c.cy], [q[0] + c.cx, q[1] + c.cy]]);
            switch (idx) {
              case 1: case 14: P(eDA(), eAB()); break;
              case 2: case 13: P(eAB(), eBC()); break;
              case 3: case 12: P(eDA(), eBC()); break;
              case 4: case 11: P(eBC(), eCD()); break;
              case 6: case 9:  P(eAB(), eCD()); break;
              case 7: case 8:  P(eDA(), eCD()); break;
              case 5:  P(eDA(), eAB()); P(eBC(), eCD()); break;
              case 10: P(eDA(), eCD()); P(eAB(), eBC()); break;
            }
          }
        }
      }
      return { segs, polys: [] };
    }
  },

  branch: {
    label: 'Branch', params: ['scale', 'rings', 'rot', 'dens', 'seed'], densLabel: 'Split',
    gen(c) {
      // six arms grown from the same reseeded generator, so every arm makes
      // the identical random choices and the whole thing lands six-fold
      const segs = [], depth = Math.min(6, Math.max(2, c.rings + 2));
      for (let k = 0; k < 6; k++) {
        const rnd = rngFor(c.seed);
        (function grow(x, y, ang, len, d) {
          if (!d || len < 1.5) return;
          const nx = x + Math.cos(ang) * len, ny = y + Math.sin(ang) * len;
          segs.push([[x, y], [nx, ny]]);
          const nl = len * (0.6 + c.dens * 0.18);
          grow(nx, ny, ang - Math.PI / 3, nl, d - 1);
          grow(nx, ny, ang + Math.PI / 3, nl, d - 1);
          if (rnd() < c.dens * 0.7) grow(nx, ny, ang, nl, d - 1);
        })(c.cx, c.cy, c.rot + k * Math.PI / 3, c.R * 1.5, depth);
      }
      return { segs, polys: [] };
    }
  },

  ripple: {
    label: 'Ripple', params: ['scale', 'rings', 'rot', 'dens'], densLabel: 'Spacing',
    gen(c) {
      // concentric rings struck from seven hex-arranged centres; the
      // interference where they cross is the pattern
      const segs = [], N = Math.max(1, Math.min(5, c.rings));
      const centres = [[0, 0]];
      for (let k = 0; k < 6; k++) {
        const a = c.rot + k * Math.PI / 3;
        centres.push([Math.cos(a) * c.R * 2, Math.sin(a) * c.R * 2]);
      }
      const gap = c.R * (0.45 + c.dens * 0.75), maxR = c.R * (N + 1.5);
      for (const [ox, oy] of centres) {
        for (let r = gap; r <= maxR; r += gap) {
          circleSegs(segs, c.cx + ox, c.cy + oy, r, Math.max(28, Math.round(r / 2.2)));
        }
      }
      return { segs, polys: [] };
    }
  },

  hexaflake: {
    label: 'Hexaflake', params: ['scale', 'rings', 'rot'],
    gen(c) {
      const segs = [], depth = Math.min(3, Math.max(1, c.rings - 1));
      (function rec(x, y, r, d) {
        if (!d) {
          const v = hexPts(x, y, r, c.rot);
          for (let k = 0; k < 6; k++) segs.push([v[k], v[(k + 1) % 6]]);
          return;
        }
        rec(x, y, r / 3, d - 1);
        for (let k = 0; k < 6; k++) {
          const a = c.rot + k * Math.PI / 3;
          rec(x + Math.cos(a) * r * 2 / 3, y + Math.sin(a) * r * 2 / 3, r / 3, d - 1);
        }
      })(c.cx, c.cy, c.R * 3.2, depth);
      return { segs, polys: [] };
    }
  },

  nested: {
    label: 'Nested', params: ['scale', 'rings', 'rot', 'dens'], densLabel: 'Twist',
    gen(c) {
      const segs = [], N = Math.max(2, c.rings);
      let prev = null;
      for (let i = 1; i <= N; i++) {
        const v = hexPts(c.cx, c.cy, c.R * i, c.rot + i * c.dens * 0.55);
        for (let k = 0; k < 6; k++) segs.push([v[k], v[(k + 1) % 6]]);
        if (prev) for (let k = 0; k < 6; k++) segs.push([prev[k], v[k]]);
        prev = v;
      }
      return { segs, polys: [] };
    }
  }
};

/* ------------------------------- clipping ------------------------------- */
// Both clippers take edges carrying an outward normal, derived from the
// centroid so the clip polygon's winding never matters.
function clipEdges(poly) {
  let cx = 0, cy = 0;
  for (const p of poly) { cx += p[0]; cy += p[1]; }
  cx /= poly.length; cy /= poly.length;
  const E = [];
  for (let i = 0; i < poly.length; i++) {
    const a = poly[i], b = poly[(i + 1) % poly.length];
    let n = [b[1] - a[1], -(b[0] - a[0])];
    if (n[0] * (cx - a[0]) + n[1] * (cy - a[1]) > 0) n = [-n[0], -n[1]];
    E.push({ p: a, n });
  }
  return E;
}

function clipSeg(a, b, E) {                       // Cyrus–Beck
  let t0 = 0, t1 = 1;
  const d = [b[0] - a[0], b[1] - a[1]];
  for (const e of E) {
    const den = e.n[0] * d[0] + e.n[1] * d[1];
    const num = e.n[0] * (a[0] - e.p[0]) + e.n[1] * (a[1] - e.p[1]);
    if (Math.abs(den) < 1e-9) { if (num > 0) return null; continue; }
    const t = -num / den;
    if (den < 0) { if (t > t0) t0 = t; }
    else { if (t < t1) t1 = t; }
    if (t0 > t1) return null;
  }
  return [[a[0] + d[0] * t0, a[1] + d[1] * t0], [a[0] + d[0] * t1, a[1] + d[1] * t1]];
}

function clipPoly(subject, E) {                   // Sutherland–Hodgman
  let out = subject;
  for (const e of E) {
    const inp = out;
    if (!inp.length) return [];
    out = [];
    for (let i = 0; i < inp.length; i++) {
      const cur = inp[i], prv = inp[(i + inp.length - 1) % inp.length];
      const dc = e.n[0] * (cur[0] - e.p[0]) + e.n[1] * (cur[1] - e.p[1]);
      const dp = e.n[0] * (prv[0] - e.p[0]) + e.n[1] * (prv[1] - e.p[1]);
      if (dc <= 0) {
        if (dp > 0) { const t = dp / (dp - dc); out.push([prv[0] + (cur[0] - prv[0]) * t, prv[1] + (cur[1] - prv[1]) * t]); }
        out.push(cur);
      } else if (dp <= 0) {
        const t = dp / (dp - dc);
        out.push([prv[0] + (cur[0] - prv[0]) * t, prv[1] + (cur[1] - prv[1]) * t]);
      }
    }
  }
  return out;
}

function framePoly(w, h, lw) {
  const cx = w / 2, cy = h / 2, R = Math.min(w, h) / 2 * S.pat.frameR;
  if (S.pat.frame === 'hex') return hexPts(cx, cy, R, S.pat.rot);
  if (S.pat.frame === 'circle') {
    const o = [];
    for (let k = 0; k < 72; k++) { const a = k / 72 * TAU; o.push([cx + Math.cos(a) * R, cy + Math.sin(a) * R]); }
    return o;
  }
  return [[0, 0], [w, 0], [w, h], [0, h]];
}

// Patterns are static under camera moves, so cache them and let orbiting
// redraw from the cached ops instead of regenerating thousands of segments.
let patCache = { key: null, ops: [] };
function patternOps(w, h, lw) {
  const P = S.pat;
  if (!P.kind || P.layer === 'off') return [];
  const key = [P.kind, P.scale, P.rings, P.rot, P.seed, P.dens, P.frame, P.frameR, w, h, lw, S.style.weight].join('|');
  if (patCache.key === key) return patCache.ops;

  const spec = PATTERNS[P.kind];
  const { segs, polys } = spec.gen({
    cx: w / 2, cy: h / 2, R: P.scale * lw,
    rings: P.rings | 0, rot: P.rot, seed: P.seed, dens: P.dens
  });
  const poly = framePoly(w, h, lw);
  const E = clipEdges(poly);
  const wgt = S.style.weight * lw * 0.78;
  const ops = [];
  for (const q of polys) { const cp = clipPoly(q, E); if (cp.length > 2) ops.push({ t:'poly', pts:cp, f:'ink' }); }
  for (const [a, b] of segs) { const s = clipSeg(a, b, E); if (s) ops.push({ t:'line', p:s, c:'ink', w:wgt }); }
  if (P.frame !== 'none') {
    for (let i = 0; i < poly.length; i++) {
      ops.push({ t:'line', p:[poly[i], poly[(i + 1) % poly.length]], c:'ink', w: wgt * 1.3 });
    }
  }
  patCache = { key, ops };
  return ops;
}

/* ---------------------------------------------------------- canvas host */
const el = {
  stage: document.getElementById('stage'),
  canvas: document.getElementById('view'),
  readout: document.getElementById('readout'),
  undo: document.getElementById('undo'),
  quickpng: document.getElementById('quickpng'),
  sheet: document.getElementById('sheet'),
  grip: document.getElementById('grip'),
  tabs: document.getElementById('tabs'),
  hint: document.getElementById('hint'),
  stamp: document.getElementById('stamp')
};
const ctx = el.canvas.getContext('2d');
let CW = 0, CH = 0, DPR = 1, lastPick = [];
let interacting = false, queued = false;

function themeColors() {
  const cs = getComputedStyle(document.documentElement);
  const g = k => cs.getPropertyValue(k).trim();
  return { paper:g('--paper'), ink:g('--ink'), ghost:g('--ink-3'), hair:g('--hair'), accent:g('--accent') };
}

function resize() {
  const r = el.stage.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  CW = Math.max(1, Math.round(r.width));
  CH = Math.max(1, Math.round(r.height));
  el.canvas.width = Math.round(CW * DPR);
  el.canvas.height = Math.round(CH * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  draw();
}

function draw() {
  if (queued) return;
  queued = true;
  requestAnimationFrame(() => {
    queued = false;
    const { ops, pick } = buildOps({ w:CW, h:CH, lw:1, draft:interacting });
    lastPick = pick;
    paint(ctx, ops, themeColors(), CW, CH);
    const pat = S.pat.kind && S.pat.layer !== 'off' ? ' · ' + PATTERNS[S.pat.kind].label : '';
    el.stamp.textContent = `Sheet 001 · ${S.shapes.length} form${S.shapes.length === 1 ? '' : 's'}` +
      (S.sym.radial > 1 ? ` · ×${S.sym.radial}` : '') + (S.sym.mirror ? ' · mirror' : '') + pat;
  });
}

/* ---------------------------------------------------------- picking */
function pickAt(x, y) {
  for (let i = lastPick.length - 1; i >= 0; i--) {
    if (inPoly(x, y, lastPick[i].pts)) return lastPick[i].shapeIdx;
  }
  return -1;
}

/* ---------------------------------------------------------- gestures */
const pointers = new Map();
let gest = null;

el.canvas.addEventListener('pointerdown', e => {
  el.canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  const r = el.canvas.getBoundingClientRect();

  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    gest = { type:'pinch', d:Math.hypot(a.x - b.x, a.y - b.y), dist:S.cam.dist };
    return;
  }
  const px = e.clientX - r.left, py = e.clientY - r.top;
  const hit = pickAt(px, py);
  if (hit >= 0) {
    const sh = S.shapes[hit];
    if (S.sel !== sh.id) { S.sel = sh.id; syncEdit(); syncReadout(); draw(); haptic(); }
    gest = { type:'move', x:e.clientX, y:e.clientY, start:snapshot(), moved:false, shape:sh, pos:sh.pos.slice() };
  } else {
    gest = { type:'orbit', x:e.clientX, y:e.clientY, yaw:S.cam.yaw, pitch:S.cam.pitch, moved:false, wasSel:S.sel };
  }
  interacting = true;
});

el.canvas.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (!gest) return;

  if (gest.type === 'pinch') {
    if (pointers.size < 2) return;
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    S.cam.dist = clamp(gest.dist * (gest.d / Math.max(1, d)), 3, 34);
    draw();
    return;
  }
  const dx = e.clientX - gest.x, dy = e.clientY - gest.y;
  if (Math.abs(dx) + Math.abs(dy) > 4) gest.moved = true;

  if (gest.type === 'orbit') {
    S.cam.yaw = gest.yaw - dx * 0.0075;
    S.cam.pitch = clamp(gest.pitch + dy * 0.0075, -1.45, 1.45);
    draw();
  } else if (gest.type === 'move') {
    const focal = Math.min(CW, CH) * 1.15;
    let ppu;
    if (S.style.proj === 'ortho') ppu = focal / S.cam.dist;
    else {
      const v = toView(gest.pos);
      ppu = focal / Math.max(0.35, S.cam.dist - v[2]);
    }
    const { right, up } = camBasis();
    const wx = dx / ppu, wy = -dy / ppu;
    gest.shape.pos = [
      gest.pos[0] + right[0]*wx + up[0]*wy,
      gest.pos[1] + right[1]*wx + up[1]*wy,
      gest.pos[2] + right[2]*wx + up[2]*wy
    ];
    syncEditValues();
    draw();
  }
});

function endPointer(e) {
  pointers.delete(e.pointerId);
  if (!gest) return;
  if (gest.type === 'move' && gest.moved) { past.push(gest.start); el.undo.disabled = false; save(); }
  if (gest.type === 'orbit') {
    if (!gest.moved && gest.wasSel !== null) { S.sel = null; syncEdit(); syncReadout(); }
    save();
  }
  if (gest.type === 'move' && !gest.moved) save();
  if (pointers.size === 0 || gest.type === 'pinch') {
    gest = null; interacting = false;
    styleRows.forEach(r => r.refresh && r.refresh());
    save(); draw();
  }
}
el.canvas.addEventListener('pointerup', endPointer);
el.canvas.addEventListener('pointercancel', endPointer);

el.canvas.addEventListener('wheel', e => {
  e.preventDefault();
  S.cam.dist = clamp(S.cam.dist * (1 + Math.sign(e.deltaY) * 0.09), 3, 34);
  draw(); save();
}, { passive:false });

function haptic() { if (navigator.vibrate) try { navigator.vibrate(8); } catch (e) {} }

/* ---------------------------------------------------------- UI factory */
function node(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

function group(title) {
  const g = node('div', 'group');
  if (title) g.appendChild(node('div', 'eyebrow', title));
  return g;
}

function slider(label, opts) {
  const { min, max, step, get, set, fmt } = opts;
  const row = node('div', 'row');
  const lab = node('div', 'lab');
  lab.appendChild(node('span', null, label));
  const val = node('span', 'val');
  lab.appendChild(val);
  const inp = document.createElement('input');
  inp.type = 'range'; inp.min = min; inp.max = max; inp.step = step;
  inp.setAttribute('aria-label', label);
  const show = () => { const v = get(); inp.value = v; val.textContent = fmt ? fmt(v) : (+v).toFixed(2); };
  inp.addEventListener('pointerdown', () => { row._pending = snapshot(); });
  inp.addEventListener('input', () => { set(parseFloat(inp.value)); show(); interacting = true; draw(); });
  const settle = () => {
    if (row._pending) { past.push(row._pending); row._pending = null; el.undo.disabled = false; }
    interacting = false; save(); draw();
  };
  inp.addEventListener('change', settle);
  inp.addEventListener('pointerup', settle);
  row.appendChild(lab); row.appendChild(inp);
  row.refresh = show; show();
  return row;
}

function segmented(label, options, get, set) {
  const row = node('div', 'row');
  if (label) {
    const lab = node('div', 'lab');
    lab.appendChild(node('span', null, label));
    row.appendChild(lab);
  }
  const seg = node('div', 'seg');
  const btns = options.map(o => {
    const b = node('button', null, o.label);
    b.addEventListener('click', () => { set(o.value); refresh(); draw(); save(); });
    seg.appendChild(b);
    return b;
  });
  function refresh() {
    const cur = get();
    options.forEach((o, i) => btns[i].setAttribute('aria-pressed', String(o.value === cur)));
  }
  row.appendChild(seg); row.refresh = refresh; refresh();
  return row;
}

function actionBtn(label, fn, cls) {
  const b = node('button', 'btn' + (cls ? ' ' + cls : ''), label);
  b.addEventListener('click', fn);
  return b;
}

/* ---------------------------------------------------------- shape icons */
function iconFor(kind) {
  const c = document.createElement('canvas');
  const d = 40, dpr = Math.min(window.devicePixelRatio || 1, 3);
  c.width = d * dpr; c.height = d * dpr;
  const cc = c.getContext('2d');
  cc.setTransform(dpr, 0, 0, dpr, 0, 0);
  const proto = defaultsFor(kind);
  const g = KINDS[kind].build(proto);
  // the tetra's verts sit on cube diagonals, so the shared angle shows it
  // face-on as a flat triangle — turn it to catch an edge instead
  const yaw = -0.6 + (kind === 'tetra' ? 0.8 : 0), pitch = 0.5, sc = 12.5;
  const P = p => {
    const q = rotX(rotY(p, -yaw), pitch);
    return [d/2 + q[0]*sc, d/2 - q[1]*sc, -q[2]];
  };
  const scr = g.v.map(P);
  const faces = g.f.map(f => {
    const wp = f.map(i => g.v[i]);
    let n = newell(wp);
    let cx=0, cy=0, cz=0; for (const p of wp) { cx+=p[0]; cy+=p[1]; cz+=p[2]; }
    const k = 1/wp.length;
    if (n[0]*cx*k + n[1]*cy*k + n[2]*cz*k < 0) n = [-n[0],-n[1],-n[2]];
    const nv = rotX(rotY(n, -yaw), pitch);
    let dep = 0; for (const i of f) dep += scr[i][2];
    return { f, dep: dep*k, front: nv[2] > 0 };
  }).filter(x => x.front).sort((a,b) => b.dep - a.dep);

  const col = themeColors();
  cc.lineJoin = 'round'; cc.lineCap = 'round';
  for (const fc of faces) {
    cc.beginPath();
    fc.f.forEach((i, j) => j ? cc.lineTo(scr[i][0], scr[i][1]) : cc.moveTo(scr[i][0], scr[i][1]));
    cc.closePath();
    cc.fillStyle = col.paper; cc.fill();
    cc.strokeStyle = col.ink; cc.lineWidth = 1.1; cc.stroke();
  }
  return c;
}

function defaultsFor(kind) {
  const base = { size:1, height:1, depth:1, sides:6 };
  if (kind === 'prism') return Object.assign(base, { size:0.85, height:1.15, sides:6 });
  if (kind === 'crystal') return Object.assign(base, { size:0.68, height:1.05, sides:6 });
  if (kind === 'pyramid') return Object.assign(base, { size:1, height:1.1, sides:4 });
  return base;
}

function addShape(t) {
  commit();
  const d = defaultsFor(t.kind);
  const s = makeShape(t.kind, Object.assign(d, t.over || {}, { name:t.label }));
  // lay new forms out on a golden-angle spiral so each one lands clear of the
  // last instead of stacking into the middle of whatever is already there
  const n = S.shapes.length;
  const a = n * 2.39996, r = n === 0 ? 0 : 1.5 * Math.sqrt(n + 0.7);
  s.pos = [Math.cos(a) * r, 0, Math.sin(a) * r];
  S.shapes.push(s);
  S.sel = s.id;
  syncAll(); draw();
  toast(`${t.label} added — drag it on the sheet`);
  haptic();
}

function loadPreset(name) {
  commit();
  S.shapes = PRESETS[name]();
  S.sym.radial = name === 'hive' ? HIVE_RADIAL : 1;
  S.sym.mirror = false;
  S.sel = null;
  syncAll(); draw();
  toast(name + ' loaded');
}
